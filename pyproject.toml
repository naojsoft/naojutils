[build-system]
requires = ["setuptools>=77",
            "setuptools_scm[toml]>=7"]
build-backend = "setuptools.build_meta"

[project]
name = "naojutils"
description = "Python modules for working with Subaru Telescope instrument data"
readme = {file = "README.txt", content-type = "text/plain"}
authors = [
    {name = "Software Division, Subaru Telescope, NAOJ", email = "ocs@naoj.org"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
keywords = ["subaru", "telescope", "observation", "data", "analysis",
            "operation"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "astropy>=6.0.1",
    "scipy>=1.11.4",
    "matplotlib>=3.8",
    "python-dateutil>=2.8.2",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/naojsoft/naojutils"

[project.entry-points."ginga.rv.plugins"]
MOIRCS_Mask_Builder = "naoj.ginga_plugins:setup_MOIRCS_Mask_Builder"

[tool.setuptools]
zip-safe = false
include-package-data = true
# NOTE: these are plain script files, not console entry points -- they
# take (options, args) from their own __main__ block rather than a
# zero-argument main(), so they cannot be listed under
# [project.scripts] without being rewritten.
script-files = [
    "scripts/focas_ifu_reconstruct_image",
    "scripts/focas_ifu_biassub",
    "scripts/focas_ifu_mkbiastemplate",
    "scripts/focas_ifu_mkflat",
    "scripts/hsc_pack",
    "scripts/pamfake",
]

[tool.setuptools.packages.find]
include = ["naoj*"]

[tool.setuptools.package-data]
"naoj.focas" = ["ifu_regions/*.reg"]

[tool.ruff]
target-version = "py311"
# the standalone scripts have no .py extension, so name them explicitly
extend-include = ["scripts/*"]

[tool.ruff.lint]
# match flake8's coverage, as ginga does: pycodestyle (E/W) + pyflakes (F)
select = ["E", "F", "W"]
ignore = [
    "E265",  # block comment should start with '# '
    "E266",  # too many leading '#' for block comment
    "E402",  # module level import not at top of file
    "E741",  # ambiguous variable name 'l'
    "E501",  # line too long
    "F841",  # local variable assigned to but never used
]

[tool.setuptools_scm]
write_to = "naoj/version.py"
version_scheme = "release-branch-semver"
