name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # settings live in pyproject.toml, [tool.ruff]
      - name: Run ruff
        run: ruff check .

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from tags, so the whole
          # history has to be here -- a shallow clone yields 0.1.devN
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          pip install .
          pip install pytest

      - name: Run tests
        # from a directory the package is not in, so the tests exercise
        # what was installed rather than the source tree
        run: pytest tests/ -v
